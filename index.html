  <script>
const loader = document.getElementById("loader");

function hideLoader() {

    if (!loader) return;

    loader.classList.add("hide-loader");

    setTimeout(() => {
        loader.remove();
    }, 5000);

}

document.addEventListener("DOMContentLoaded", () => {

    // Delay 800ms agar animasi terlihat smooth
    setTimeout(hideLoader, 5000);

});

// Backup jika halaman lambat
window.addEventListener("load", hideLoader);

// Paksa hilang maksimal 3 detik jika ada yang macet
setTimeout(hideLoader, 5000);

/*=============================
     MASKERTOTO LOADER V3
     AQUA THEME
==============================*/

#loader{

    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#06141d;

    z-index:999999;

    transition:
    opacity .35s ease,
    visibility .35s ease;

}

.loader-box{

    text-align:center;

    animation:fadeIn .5s ease;

}

.loader-logo{

    width:280px;
    max-width:75vw;

    user-select:none;
    pointer-events:none;

    animation:floatLogo 2.2s ease-in-out infinite;

}

/* BAR */

.loader-bar{

    width:230px;
    height:6px;

    margin:28px auto 16px;

    background:#14313f;

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.08);

}

.loader-progress{

    display:block;

    width:100%;
    height:100%;

    background:linear-gradient(
        90deg,
        #ffffff,
        #bffcff,
        #47e8ff,
        #00b8e6
    );

    transform:translateX(-100%);

    animation:progress .85s ease forwards;

}

/* TEXT */

.loader-text{

    display:flex;
    justify-content:center;
    gap:2px;
    margin-top:18px;

}

.loader-text span{

    font-size:18px;
    font-weight:800;
    letter-spacing:1px;

    background:linear-gradient(
        180deg,
        #ffffff,
        #eafcff,
        #8ef5ff,
        #25dfff,
        #0098d4
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
        0 1px 0 rgba(255,255,255,.35),
        0 0 8px rgba(71,232,255,.28);

    animation:bounce .9s infinite ease-in-out;

}

.loader-text span:nth-child(2){animation-delay:.08s;}
.loader-text span:nth-child(3){animation-delay:.16s;}
.loader-text span:nth-child(4){animation-delay:.24s;}
.loader-text span:nth-child(5){animation-delay:.32s;}
.loader-text span:nth-child(6){animation-delay:.40s;}
.loader-text span:nth-child(7){animation-delay:.48s;}
.loader-text span:nth-child(8){animation-delay:.56s;}
.loader-text span:nth-child(9){animation-delay:.64s;}
.loader-text span:nth-child(10){animation-delay:.72s;}

@keyframes bounce{

    0%,100%{
        transform:translateY(0);
        opacity:.7;
    }

    50%{
        transform:translateY(-4px);
        opacity:1;
    }

}

.hide-loader{

    opacity:0;
    visibility:hidden;

}

/*=============================
          ANIMATION
==============================*/

@keyframes progress{

    to{
        transform:translateX(0);
    }

}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes floatLogo{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

}

/* MOBILE */

@media(max-width:768px){

.loader-logo{
    width:220px;
}

.loader-bar{
    width:190px;
}

.loader-text{
    font-size:14px;
}

    }

  content:"";

  width:45px;
  height:2px;

  background:#e6a52e;

  box-shadow:0 0 5px #e6a52e;

  top:0;
  left:0;

  border-radius:10px;

  pointer-events:none;
  z-index:100;

  animation:kelilingBox 4s linear infinite;
}

@keyframes kelilingBox{

  /* ATAS */
  0%{
    top:0;
    left:0;
    width:45px;
    height:2px;
  }

  24%{
    top:0;
    left:calc(100% - 45px);
    width:45px;
    height:2px;
  }

  /* KANAN */
  25%{
    top:0;
    left:calc(100% - 2px);
    width:2px;
    height:45px;
  }

  49%{
    top:calc(100% - 45px);
    left:calc(100% - 2px);
    width:2px;
    height:45px;
  }

  /* BAWAH */
  50%{
    top:calc(100% - 2px);
    left:calc(100% - 45px);
    width:45px;
    height:2px;
  }

  74%{
    top:calc(100% - 2px);
    left:0;
    width:45px;
    height:2px;
  }

  /* KIRI */
  75%{
    top:calc(100% - 45px);
    left:0;
    width:2px;
    height:45px;
  }

  99%{
    top:0;
    left:0;
    width:2px;
    height:45px;
  }

  /* KEMBALI KE ATAS */
  100%{
    top:0;
    left:0;
    width:45px;
    height:2px;
  }

const gallery=document.getElementById("gallery");
const empty=document.getElementById("empty");
const total=document.getElementById("total");
const result=document.getElementById("result");
const searchInput=document.getElementById("searchInput");


function render(list){

  gallery.innerHTML="";

  total.textContent=list.length;
  result.textContent=list.length+" album";

  empty.style.display=list.length?"none":"block";


  list.forEach(x=>{

    const card=document.createElement("article");

    card.className="card";

    card.innerHTML=`
      <div class="photo">
        <span>BUKTI FOTO</span>
      </div>

      <div class="info">
        <div class="provider-name">${x.provider}</div>
        <div class="game">${x.game}</div>
        <div class="amount">${x.amount}</div>
        <div class="date">${x.date}</div>
      </div>
    `;


    const photo=card.querySelector(".photo");

    const img=new Image();

    img.src=x.img;
    img.alt=x.game;


    img.onload=()=>{

      photo.innerHTML="";

      /* GAMBAR */
      photo.appendChild(img);


      /* =========================
         TOMBOL VIEW
      ========================= */

      const view=document.createElement("div");

      view.style.cssText=
      "position:absolute;" +
      "right:43px;" +
      "bottom:7px;" +
      "background:rgba(48,8,10,.92);" +
      "color:#fff;" +
      "border:1px solid #e6a52e;" +
      "border-radius:5px;" +
      "padding:4px 6px;" +
      "font-size:7px;" +
      "cursor:pointer;" +
      "z-index:10;" +
      "box-shadow:0 0 6px rgba(22,140,255,.25);";

      view.textContent="VIEW";


      /* VIEW KLIK */
      view.onclick=(e)=>{
        e.stopPropagation();
        openImage(x.img);
      };


      photo.appendChild(view);


      /* =========================
         TOMBOL PLAY
      ========================= */

      const play=document.createElement("button");

      play.type="button";

      play.textContent="PLAY";

      play.style.cssText=
        "position:absolute;" +
        "right:8px;" +
        "bottom:7px;" +
        "background:rgba(48,8,10,.95);" +
        "color:#fff;" +
        "border:1px solid #e6a52e;" +
        "border-radius:5px;" +
        "padding:4px 8px;" +
        "font-size:7px;" +
        "font-weight:800;" +
        "cursor:pointer;" +
        "z-index:10;" +
        "transition:.2s ease;" +
        "box-shadow:0 0 7px rgba(22,140,255,.3);";


      /* PLAY KLIK */
      play.onclick=(e)=>{

        e.stopPropagation();

        if(x.playUrl){

          window.open(
            x.playUrl,
            "_blank",
            "noopener,noreferrer"
          );

        }

      };


      photo.appendChild(play);

    };


    /* KLIK GAMBAR */
    photo.onclick=()=>openImage(x.img);


    gallery.appendChild(card);

  });

}


function filterProvider(p){

  document
    .querySelectorAll(".provider")
    .forEach(b=>
      b.classList.toggle(
        "active",
        b.dataset.provider===p
      )
    );

  applyFilter(p,searchInput.value);

}


function applyFilter(p,query){

  const q=query.trim().toLowerCase();

  let list=
    p==="all"
      ?data
      :data.filter(x=>x.p===p);


  if(q){

    list=list.filter(x=>
      (
        x.provider+" "+
        x.game+" "+
        x.amount
      )
      .toLowerCase()
      .includes(q)
    );

  }


  render(list);

}


document
  .querySelectorAll(".provider")
  .forEach(b=>{

    b.addEventListener(
      "click",
      ()=>filterProvider(b.dataset.provider)
    );

  });


searchInput.addEventListener(
  "input",
  ()=>{

    const active=
      document
        .querySelector(".provider.active")
        .dataset.provider;

    applyFilter(
      active,
      searchInput.value
    );

  }
);


function openImage(src) {
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");

  lightboxImg.src = src;
  lightbox.classList.add("show");
}

function closeImage() {
  const lightbox = document.getElementById("lightbox");

  lightbox.classList.remove("show");

  document.getElementById("lightboxImg").src = "";

  // Pastikan semua kartu game tetap tampil
  document.getElementById("gallery").style.display = "grid";
}

// Klik di mana saja pada popup untuk menutup gambar
document.getElementById("lightbox").onclick = function() {
  closeImage();
};

// Tombol X tetap berfungsi
document.getElementById("close").onclick = function(e) {
  e.stopPropagation();
  closeImage();
};

// Klik gambar juga langsung menutup popup
document.getElementById("lightboxImg").onclick = function() {
  closeImage();
};

render(data);

</script>
